<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main-layout :: layout(~{::main}, ${pageTitle}, ${user}, ${navItems})}">
<head>
    <!-- This head section is now effectively ignored because the entire page is replaced by the layout. -->
    <!-- The title below is just a placeholder for static viewing. -->
    <title>This will be replaced</title>

<body>

<!-- The 'main' fragment is passed as the 'content' parameter to the layout -->
<main class="flex-1 overflow-auto bg-[#FAFAFA] p-8 space-y-6">
    <!-- Content from teacher3.html -->
    <div class="grid grid-cols-4 gap-6">
        <div class="bg-white rounded-xl border border-primary p-4 flex items-center justify-between relative shadow-sm">
            <div class="absolute -bottom-2 left-1/2 transform -translate-x-1/2 w-4 h-4 bg-white border-b border-r border-primary rotate-45"></div>
            <div>
                <p class="text-xs font-bold text-gray-400 mb-1 uppercase tracking-wider">My Courses</p>
                <div class="flex items-end space-x-2">
                    <span class="text-3xl font-bold text-primary leading-none">10</span>
                    <span class="text-xs text-primary font-semibold mb-1">ACTIVE</span>
                </div>
            </div>
            <div class="w-10 h-10 bg-red-50 text-primary rounded-lg flex items-center justify-center opacity-80">
                <i class="fa-solid fa-laptop-code text-xl"></i>
            </div>
        </div>
        <div class="bg-white rounded-xl border border-gray-100 p-4 flex items-center justify-between shadow-sm">
            <div>
                <p class="text-xs font-bold text-gray-400 mb-1 uppercase tracking-wider">Homework</p>
                <div class="flex items-end space-x-2">
                    <span class="text-3xl font-bold text-brandBlue leading-none">13</span>
                    <span class="text-xs text-brandBlue font-semibold mb-1">DUE TODAY</span>
                </div>
            </div>
            <div class="w-10 h-10 bg-blue-50 text-brandBlue rounded-lg flex items-center justify-center opacity-80">
                <i class="fa-solid fa-book-open text-xl"></i>
            </div>
        </div>
        <div class="bg-white rounded-xl border border-gray-100 p-4 flex items-center justify-between shadow-sm">
            <div>
                <p class="text-xs font-bold text-gray-400 mb-1 uppercase tracking-wider">Timetable</p>
                <div class="flex items-end space-x-2">
                    <span class="text-3xl font-bold text-brandGreen leading-none">07</span>
                    <span class="text-xs text-brandGreen font-semibold mb-1">TODAY</span>
                </div>
            </div>
            <div class="w-10 h-10 bg-green-50 text-brandGreen rounded-lg flex items-center justify-center opacity-80">
                <i class="fa-regular fa-calendar-check text-xl"></i>
            </div>
        </div>
        <div class="bg-white rounded-xl border border-gray-100 p-4 flex items-center justify-between shadow-sm">
            <div>
                <p class="text-xs font-bold text-gray-400 mb-1 uppercase tracking-wider">Q&A Activity</p>
                <div class="flex items-end space-x-2">
                    <span class="text-3xl font-bold text-brandPurple leading-none">17</span>
                    <span class="text-xs text-brandPurple font-semibold mb-1">NEW POSTS</span>
                </div>
            </div>
            <div class="w-10 h-10 bg-purple-50 text-brandPurple rounded-lg flex items-center justify-center opacity-80">
                <i class="fa-solid fa-puzzle-piece text-xl"></i>
            </div>
        </div>
    </div>
