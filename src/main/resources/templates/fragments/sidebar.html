<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar(navItems)" id="sidebar" class="w-16 flex flex-col py-6 bg-[#FAF4F0] z-20 shrink-0 transition-all duration-300 ease-in-out overflow-x-hidden h-full">

    <div class="w-full flex items-center px-5 mb-8 mt-2 shrink-0">
        <button id="sidebarToggle" class="text-[#2B253C] hover:opacity-70 transition-colors focus:outline-none w-6 flex justify-center shrink-0">
            <i class="fa-solid fa-bars text-xl"></i>
        </button>
        <span class="sidebar-text max-w-0 opacity-0 ml-0 overflow-hidden whitespace-nowrap font-extrabold text-lg text-[#2B253C] transition-all duration-300 tracking-wide">HDUES</span>
    </div>

    <nav class="flex flex-col space-y-2 flex-1 w-full">
        <a th:each="item : ${navItems}" th:href="@{${item.url}}"
           class="relative group flex items-center px-5 py-3 w-full transition-colors"
           th:classappend="${item.active} ? 'text-[#E04F3E] font-bold' : 'text-[#8A8696] font-semibold hover:text-[#2B253C] hover:bg-[#F2EAE5]'">

            <span th:if="${item.active}" class="absolute right-0 top-1/2 -translate-y-1/2 w-1 h-8 bg-[#E04F3E] rounded-l-full"></span>

            <div class="w-6 flex justify-center shrink-0">
                <i class="fa-solid" th:classappend="${item.icon} + ' text-xl'"></i>
            </div>

            <span class="sidebar-text max-w-0 opacity-0 ml-0 overflow-hidden whitespace-nowrap text-sm transition-all duration-300" th:text="${item.label}">Menu Item</span>
        </a>
    </nav>

    <div class="mt-auto flex flex-col space-y-2 w-full pt-4">
        <a th:href="@{/settings}" class="relative group flex items-center px-5 py-3 w-full transition-colors text-[#8A8696] font-semibold hover:text-[#2B253C] hover:bg-[#F2EAE5]">
            <div class="w-6 flex justify-center shrink-0"><i class="fa-solid fa-gear text-xl"></i></div>
            <span class="sidebar-text max-w-0 opacity-0 ml-0 overflow-hidden whitespace-nowrap text-sm transition-all duration-300">Settings</span>
        </a>
        <a th:href="@{/logout}" class="relative group flex items-center px-5 py-3 w-full transition-colors text-[#8A8696] font-semibold hover:text-[#E04F3E] hover:bg-[#FCE7F3]">
            <div class="w-6 flex justify-center shrink-0"><i class="fa-solid fa-arrow-right-from-bracket text-xl"></i></div>
            <span class="sidebar-text max-w-0 opacity-0 ml-0 overflow-hidden whitespace-nowrap text-sm transition-all duration-300">Logout</span>
        </a>
    </div>

</aside>
</body>
</html>
