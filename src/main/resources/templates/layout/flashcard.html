<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-4xl font-bold text-blue-600 mb-8 text-center">📇 Hệ Thống Học Flashcard</h1>
        <div class="mb-10 text-right">
            <a href="/flashcards/new" class="bg-green-600 text-white px-6 py-3 rounded-full font-bold shadow-lg hover:bg-green-700 transition">
            + Tạo Bộ Thẻ Mới
            </a>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div th:each="card : ${flashcards}" class="bg-white rounded-xl shadow-lg hover:shadow-2xl transition-shadow p-6 border-t-4 border-blue-500">
                <h2 class="text-xl font-bold text-gray-800" th:text="${card.title}">Tiêu đề</h2>
                <p class="text-gray-600 mt-2" th:text="${card.description}">Mô tả ngắn về bộ thẻ...</p>
                
                <div class="mt-4 flex justify-between items-center">
                    <span class="text-sm font-medium text-blue-500" th:text="${card.questions.size()} + ' Câu hỏi'">0 câu</span>
                    <a href="#" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">Học ngay</a>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(flashcards)}" class="text-center py-20">
            <p class="text-gray-500 text-xl">Chưa có bộ thẻ nào. Hãy dùng Postman tạo thử nhé!</p>
        </div>
    </div>
</body>
</html>
