<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content, pageTitle, user, navItems)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - HDUES Dashboard'">HDUES Dashboard</title>

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Nunito', 'sans-serif'] },
                    colors: {
                        primary: '#FF4B4B', bgLight: '#F4F7FB', textDark: '#2D3748',
                        textMuted: '#A0AEC0', brandBlue: '#4299E1', brandYellow: '#ECC94B',
                        brandPurple: '#9F7AEA', brandGreen: '#48BB78',
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS -->
    <link th:href="@{/css/dashboard.css}" rel="stylesheet">
</head>
<body class="bg-gray-200 h-screen w-screen overflow-hidden">

<div class="w-full h-full bg-white flex">

    <!-- Sidebar Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar(navItems=${navItems})}"></div>

    <main class="flex-1 flex flex-col h-full bg-white relative">
        <!-- Header Fragment -->
        <div th:replace="~{fragments/header :: header(pageTitle=${pageTitle}, user=${user})}"></div>

        <!-- Main Content (Passed from child page) -->
        <th:block th:replace="${content}"></th:block>
    </main>

</div>

<script>
    // Script for sidebar toggle and user menu dropdown
    document.addEventListener('DOMContentLoaded', () => {
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('sidebarToggle');
        const texts = document.querySelectorAll('.sidebar-text');

        if (toggleBtn && sidebar) {
            toggleBtn.addEventListener('click', () => {
                const isExpanded = sidebar.classList.contains('w-56');
                if (isExpanded) {
                    sidebar.classList.replace('w-56', 'w-16');
                    texts.forEach(t => {
                        t.classList.replace('max-w-[150px]', 'max-w-0');
                        t.classList.replace('opacity-100', 'opacity-0');
                        t.classList.replace('ml-4', 'ml-0');
                    });
                } else {
                    sidebar.classList.replace('w-16', 'w-56');
                    texts.forEach(t => {
                        t.classList.replace('max-w-0', 'max-w-[150px]');
                        t.classList.replace('opacity-0', 'opacity-100');
                        t.classList.replace('ml-0', 'ml-4');
                    });
                }
            });
        }

        const userMenuButton = document.getElementById('user-menu-button');
        const userMenu = document.getElementById('user-menu');
        if (userMenuButton) {
            userMenuButton.addEventListener('click', () => {
                userMenu.classList.toggle('hidden');
            });
            document.addEventListener('click', (event) => {
                if (!userMenuButton.contains(event.target) && !userMenu.contains(event.target)) {
                    userMenu.classList.add('hidden');
                }
            });
        }
    });
</script>
</body>
</html>
